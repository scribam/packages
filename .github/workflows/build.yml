name: Packages

on:
  workflow_dispatch:
  push:
    branches: [master, next]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  repository_dispatch:
    types: [run_build]

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare_jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare build matrix
        id: set-matrix
        shell: bash
        run: |
          echo 'matrix<<EOF' >> "$GITHUB_OUTPUT"
          node create-matrix.js >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"
          if [[ '${{ github.event.pull_request.head.repo.fork }}' == 'true' ]]; then
            tag=master
          else
            tag=$(sed 's/[^a-zA-Z0-9._-]/-/g' \
              <<< '${{ github.head_ref || github.ref_name }}')
          fi
          if [[ '${{ github.base_ref || github.ref_name }}' == 'next' ]]; then
            dependency_ref=next
          else
            dependency_ref=master
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "dependency_ref=$dependency_ref" >> "$GITHUB_OUTPUT"

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tag: ${{ steps.set-matrix.outputs.tag }}
      dependency_ref: ${{ steps.set-matrix.outputs.dependency_ref }}

  prepare_docker:
    runs-on: ubuntu-latest
    needs: prepare_jobs
    permissions:
      contents: read
      packages: write
    steps:
      - name: Explain external-fork image selection
        if: github.event.pull_request.head.repo.fork == true
        run: |
          echo 'External forks use the published master build image.'
      - uses: actions/checkout@v6
        if: github.event.pull_request.head.repo.fork != true
      - name: Set up Docker Buildx
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/vitasdk:${{ needs.prepare_jobs.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITASDK_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
            BUILDSCRIPTS_REF=${{ needs.prepare_jobs.outputs.dependency_ref }}
            VITA_MAKEPKG_REF=master

  build_tier0_main:
    needs: [prepare_jobs, prepare_docker]

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier0_main }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}
    secrets: inherit

  build_tier0_slow:
    needs: [prepare_jobs, prepare_docker]

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier0_slow }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}
    secrets: inherit

  build_tier1_main:
    needs: [prepare_jobs, prepare_docker, build_tier0_main]


    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier1_main }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}
    secrets: inherit

  build_tier1_slow:
    needs: [prepare_jobs, prepare_docker, build_tier0_main, build_tier0_slow]


    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier1_slow }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}
    secrets: inherit

  build_tier2_main:
    needs: [prepare_jobs, prepare_docker, build_tier1_main]


    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier2_main }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}
    secrets: inherit

  build_tier2_slow:
    needs: [prepare_jobs, prepare_docker, build_tier1_main, build_tier1_slow]


    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier2_slow }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}
    secrets: inherit

  build_tier3_main:
    needs: [prepare_jobs, prepare_docker, build_tier2_main]


    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier3_main }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}
    secrets: inherit

  build_tier3_slow:
    needs: [prepare_jobs, prepare_docker, build_tier2_main, build_tier2_slow]


    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier3_slow }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}
    secrets: inherit

  build_tier4_main:
    needs: [prepare_jobs, prepare_docker, build_tier3_main]


    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier4_main }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}

    secrets: inherit

  build_tier4_slow:
    needs: [prepare_jobs, prepare_docker, build_tier3_main, build_tier3_slow]


    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier4_slow }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}

    secrets: inherit

  create-repository:
    needs: [prepare_jobs, build_tier0_main, build_tier0_slow, build_tier1_main, build_tier1_slow, build_tier2_main, build_tier2_slow, build_tier3_main, build_tier3_slow, build_tier4_main, build_tier4_slow]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: package-*
          merge-multiple: true

      - name: Create and validate repository
        shell: bash
        run: |
          source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          docker run --rm \
            --platform linux/amd64 \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$PWD/packages,target=/input,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP,target=/output" \
            --env "SOURCE_DATE_EPOCH=$source_date_epoch" \
            archlinux@sha256:c1829f370be8434135f43fb3acaef1256780804ac3b2d2eec90dfb1232e1ffdf \
            bash -euc \
              '/workspace/scripts/create-repository.sh /output/repository /input/*.pkg.tar.*'

      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repository-snapshot
          path: ${{ runner.temp }}/repository/*
          if-no-files-found: error
          retention-days: 14

  publish-snapshot:
    needs: create-repository
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: repository-snapshot
          path: repository

      - name: Revalidate downloaded snapshot
        shell: bash
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            archlinux@sha256:c1829f370be8434135f43fb3acaef1256780804ac3b2d2eec90dfb1232e1ffdf \
            /workspace/scripts/validate-repository.sh /workspace/repository

      - name: Publish immutable snapshot release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot_tag="packages-snapshot-$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "tag=$snapshot_tag" >> "$GITHUB_OUTPUT"
          gh release create "$snapshot_tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$snapshot_tag" \
            --notes "Vita package repository snapshot from $GITHUB_SHA"
          gh release upload "$snapshot_tag" repository/*

          mkdir downloaded-release
          gh release download "$snapshot_tag" --dir downloaded-release
          diff -ru repository downloaded-release
          gh release edit "$snapshot_tag" --draft=false
