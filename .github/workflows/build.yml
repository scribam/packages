name: Packages

on:
  workflow_dispatch:
    inputs:
      core_snapshot:
        description: Exact core SDK snapshot tag from vitasdk/autobuilds (e.g. sdk-snapshot-20260811.1.1)
        required: false
        type: string
      packages_ref:
        description: Branch or commit from vitasdk/packages
        required: false
        type: string
      buildscripts_sha:
        description: Exact commit SHA from vitasdk/buildscripts
        required: false
        type: string
  push:
    branches: [master, next]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  repository_dispatch:
    types: [run_build]

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare_jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare build matrix and parameters
        id: set-matrix
        shell: bash
        run: |
          echo 'matrix<<EOF' >> "$GITHUB_OUTPUT"
          node create-matrix.js >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"
          if [[ '${{ github.event.pull_request.head.repo.fork }}' == 'true' ]]; then
            tag=master
          else
            tag=$(sed 's/[^a-zA-Z0-9._-]/-/g' \
              <<< '${{ github.head_ref || github.ref_name }}')
          fi

          core_snapshot=""
          buildscripts_sha=""
          if [[ '${{ github.event_name }}' == 'repository_dispatch' ]]; then
            core_snapshot='${{ github.event.client_payload.core_snapshot }}'
            buildscripts_sha='${{ github.event.client_payload.buildscripts_sha }}'
            dependency_ref='${{ github.event.client_payload.packages_ref || 'next' }}'
            if [[ -z "$core_snapshot" ]]; then
              echo "::error::repository_dispatch must provide client_payload.core_snapshot"
              exit 1
            fi
          elif [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            core_snapshot='${{ inputs.core_snapshot }}'
            buildscripts_sha='${{ inputs.buildscripts_sha }}'
            dependency_ref='${{ inputs.packages_ref || github.ref_name }}'
          else
            if [[ '${{ github.base_ref || github.ref_name }}' == 'next' ]]; then
              dependency_ref=next
            else
              dependency_ref=master
            fi
          fi

          packages_sha=$(git rev-parse HEAD)

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "dependency_ref=$dependency_ref" >> "$GITHUB_OUTPUT"
          echo "core_snapshot=$core_snapshot" >> "$GITHUB_OUTPUT"
          echo "buildscripts_sha=$buildscripts_sha" >> "$GITHUB_OUTPUT"
          echo "packages_sha=$packages_sha" >> "$GITHUB_OUTPUT"

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tag: ${{ steps.set-matrix.outputs.tag }}
      dependency_ref: ${{ steps.set-matrix.outputs.dependency_ref }}
      core_snapshot: ${{ steps.set-matrix.outputs.core_snapshot }}
      buildscripts_sha: ${{ steps.set-matrix.outputs.buildscripts_sha }}
      packages_sha: ${{ steps.set-matrix.outputs.packages_sha }}

  prepare_docker:
    runs-on: ubuntu-latest
    needs: prepare_jobs
    permissions:
      contents: read
      packages: write
    steps:
      - name: Explain external-fork image selection
        if: github.event.pull_request.head.repo.fork == true
        run: |
          echo 'External forks use the published master build image.'
      - uses: actions/checkout@v6
        if: github.event.pull_request.head.repo.fork != true
      - name: Set up Docker Buildx
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/vitasdk:${{ needs.prepare_jobs.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITASDK_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
            VDPM_REF=${{ needs.prepare_jobs.outputs.dependency_ref }}
            CORE_SNAPSHOT=${{ needs.prepare_jobs.outputs.core_snapshot }}

  build_tier0_main:
    needs: [prepare_jobs, prepare_docker]

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier0_main }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}
    secrets: inherit

  build_tier0_slow:
    needs: [prepare_jobs, prepare_docker]

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier0_slow }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}
    secrets: inherit

  build_tier1_main:
    needs: [prepare_jobs, prepare_docker, build_tier0_main]

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier1_main }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}
    secrets: inherit

  build_tier1_slow:
    needs: [prepare_jobs, prepare_docker, build_tier0_main, build_tier0_slow]

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier1_slow }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}
    secrets: inherit

  build_tier2_main:
    needs: [prepare_jobs, prepare_docker, build_tier1_main]

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier2_main }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}
    secrets: inherit

  build_tier2_slow:
    needs: [prepare_jobs, prepare_docker, build_tier1_main, build_tier1_slow]

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier2_slow }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}
    secrets: inherit

  build_tier3_main:
    needs: [prepare_jobs, prepare_docker, build_tier2_main]

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier3_main }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}
    secrets: inherit

  build_tier3_slow:
    needs: [prepare_jobs, prepare_docker, build_tier2_main, build_tier2_slow]

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier3_slow }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}
    secrets: inherit

  build_tier4_main:
    needs: [prepare_jobs, prepare_docker, build_tier3_main]

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier4_main }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}

    secrets: inherit

  build_tier4_slow:
    needs: [prepare_jobs, prepare_docker, build_tier3_main, build_tier3_slow]

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare_jobs.outputs.matrix).tier4_slow }}
    uses: ./.github/workflows/build_package.yml
    with:
      package: ${{ matrix.package }}
      image_tag: ${{ needs.prepare_jobs.outputs.tag }}

    secrets: inherit

  create-repository:
    needs:
      [
        prepare_jobs,
        build_tier0_main,
        build_tier0_slow,
        build_tier1_main,
        build_tier1_slow,
        build_tier2_main,
        build_tier2_slow,
        build_tier3_main,
        build_tier3_slow,
        build_tier4_main,
        build_tier4_slow,
      ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: package-*
          merge-multiple: true

      - name: Create and validate repository
        shell: bash
        run: |
          source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          docker run --rm \
            --platform linux/amd64 \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$PWD/packages,target=/input,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP,target=/output" \
            --env "SOURCE_DATE_EPOCH=$source_date_epoch" \
            archlinux@sha256:c1829f370be8434135f43fb3acaef1256780804ac3b2d2eec90dfb1232e1ffdf \
            bash -euc \
              '/workspace/scripts/create-repository.sh /output/repository /input/*.pkg.tar.*'
          
          # Generate explicit provenance metadata
          cat <<EOF > "${{ runner.temp }}/repository/provenance.json"
          {
            "schema_version": 1,
            "core_snapshot": "${{ needs.prepare_jobs.outputs.core_snapshot }}",
            "packages_revision": "${{ needs.prepare_jobs.outputs.packages_sha }}",
            "buildscripts_revision": "${{ needs.prepare_jobs.outputs.buildscripts_sha }}"
          }
          EOF

      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repository-snapshot
          path: ${{ runner.temp }}/repository/*
          if-no-files-found: error
          retention-days: 14

  publish-snapshot:
    needs: [prepare_jobs, create-repository]
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/next') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: repository-snapshot
          path: repository

      - name: Revalidate downloaded snapshot
        shell: bash
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            archlinux@sha256:c1829f370be8434135f43fb3acaef1256780804ac3b2d2eec90dfb1232e1ffdf \
            /workspace/scripts/validate-repository.sh /workspace/repository

      - name: Publish immutable snapshot release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot_tag="packages-snapshot-$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "tag=$snapshot_tag" >> "$GITHUB_OUTPUT"
          gh release create "$snapshot_tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$snapshot_tag" \
            --notes "Vita package repository snapshot from $GITHUB_SHA built against core ${{ needs.prepare_jobs.outputs.core_snapshot }}"
          gh release upload "$snapshot_tag" repository/*

          mkdir downloaded-release
          gh release download "$snapshot_tag" --dir downloaded-release
          diff -ru repository downloaded-release
          gh release edit "$snapshot_tag" --draft=false

      - name: Trigger channel manifest update
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::REPO_DISPATCH_TOKEN secret is required for cross-repo dispatch to vitasdk/autobuilds"
            exit 1
          fi
          gh api repos/vitasdk/autobuilds/dispatches \
            -f event_type=update_channel \
            -f client_payload[core_snapshot]="${{ needs.prepare_jobs.outputs.core_snapshot }}" \
            -f client_payload[packages_snapshot]="${snapshot_tag}" \
            -f client_payload[packages_sha]="${{ needs.prepare_jobs.outputs.packages_sha }}" \
            -f client_payload[buildscripts_sha]="${{ needs.prepare_jobs.outputs.buildscripts_sha }}"
