name: Build package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      image_tag:
        required: true
        type: string

jobs:
  build:
    if: inputs.package != '__dummy__'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}/vitasdk:${{ inputs.image_tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve package artifacts
        id: dependencies
        shell: bash
        run: |
          dependencies=$(node create-matrix.js deps-list '${{ inputs.package }}')
          if [[ -n $dependencies ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo "pattern=$(node create-matrix.js deps '${{ inputs.package }}')" \
              >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download dependency packages
        if: steps.dependencies.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dependencies
          merge-multiple: true
          pattern: ${{ steps.dependencies.outputs.pattern }}

      - name: Install dependency packages
        if: steps.dependencies.outputs.present == 'true'
        shell: bash
        run: |
          mapfile -d '' packages < <(
            find dependencies -type f -name '*.pkg.tar.*' -print0 | sort -z
          )
          (( ${#packages[@]} > 0 ))
          # The bootstrap archive ships no var/ tree: vdpm and vita-makepkg
          # create it on demand, and this direct invocation must do the same or
          # pacman refuses the paths it is handed.
          mkdir -p "$VITASDK/var/lib/pacman" \
                   "$VITASDK/var/cache/pacman/pkg" \
                   "$VITASDK/var/log"
          "$VITASDK/bin/pacman" \
            --config "$VITASDK/etc/pacman.conf" \
            --root "$VITASDK" \
            --dbpath "$VITASDK/var/lib/pacman" \
            --cachedir "$VITASDK/var/cache/pacman/pkg" \
            --logfile "$VITASDK/var/log/pacman.log" \
            --noscriptlet --noconfirm --noprogressbar \
            --upgrade --asdeps --needed "${packages[@]}"

      - name: Build package
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          ./build.sh '${{ inputs.package }}' package

      - name: Upload versioned package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ inputs.package }}
          path: package/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 7
